<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Photo Frame</title>
<meta name="description" content="Add a clean border with camera, lens and exposure info to your photos — full resolution, right in the browser. 给照片加上相机参数边框。">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Photo Frame — camera info borders for your photos">
<meta property="og:description" content="Reads EXIF from your photo and prints it on a clean border, at full resolution. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' fill='%23fff' stroke='%23000' stroke-width='6'/%3E%3Crect x='18' y='18' width='64' height='48' fill='%23000'/%3E%3Ccircle cx='74' cy='80' r='6' fill='%23e3000f'/%3E%3C/svg%3E">
<style>
  /* Swiss / camera-manual look: white, black, cool greys, one red dot. */
  :root{
    --bg:#ffffff; --bg2:#f3f3f4; --ink:#000000; --ink2:#2b2b2e; --muted:#6b6b70; --dim:#9d9da3;
    --rule:#000000; --line:#dcdce0; --line2:#c4c4ca;
    --red:#e3000f;
    --stage:#ececee;
    --sans:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* ── top bar ── */
  .top{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:0 max(16px,env(safe-area-inset-left));padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));
    background:var(--bg);border-bottom:1.5px solid var(--rule);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
  .brand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
  .spacer{flex:1}
  .back{font-size:.82rem;color:var(--muted);text-decoration:none;white-space:nowrap}
  .back:hover{color:var(--ink)}
  .lang{border:1.5px solid var(--ink);background:var(--bg);padding:3px 10px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
  .lang:hover{background:var(--ink);color:var(--bg)}

  main{max-width:1180px;margin:0 auto;padding:0 16px}

  /* ── stages ── */
  .hero,.loading,.editor{display:none}
  body[data-stage="empty"] .hero{display:grid}
  body[data-stage="loading"] .loading{display:flex}
  body[data-stage="editor"] .editor{display:grid}

  /* ── hero ── */
  .hero{grid-template-columns:1fr;gap:32px;padding:36px 0 48px}
  .hero-copy{display:flex;flex-direction:column;gap:18px}
  .hero h1{font-weight:800;font-size:clamp(2.4rem,10vw,4.6rem);line-height:.98;letter-spacing:-.045em}
  .hero h1 em{font-style:normal;color:var(--red)}
  html[lang="zh-CN"] .hero h1{font-size:clamp(2.1rem,9vw,3.8rem);line-height:1.12;letter-spacing:-.02em}
  .hero-copy p{color:var(--ink2);max-width:30em;font-size:1rem}
  .spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;border-top:1.5px solid var(--rule);padding-top:14px;font-size:.8rem;max-width:30em}
  .spec dt{color:var(--muted)}
  .spec dd{font-weight:600}
  .pick-cta{
    align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border:none;
    padding:16px 22px;font-weight:700;font-size:1rem;letter-spacing:-.01em;
  }
  .pick-cta::after{content:"→";font-weight:400}
  .pick-cta:hover{background:var(--red)}
  .pick-card{display:block;width:100%;border:none;background:none;padding:0;text-align:left}
  .mock{background:#fff;border:1.5px solid var(--rule)}
  .mock-photo{aspect-ratio:3/2;background:
      linear-gradient(180deg,#9fb4c8 0%,#c9d3dc 48%,#e8ebee 49%,#6d7f8f 50%,#34424f 100%);position:relative;overflow:hidden}
  .mock-photo::before{content:"";position:absolute;left:58%;top:22%;width:14%;aspect-ratio:1;border-radius:50%;background:var(--red)}
  .mock-photo::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:#1d252c;clip-path:polygon(0 55%,22% 20%,38% 48%,58% 10%,76% 44%,90% 26%,100% 40%,100% 100%,0 100%)}
  .mock-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 13px;gap:10px}
  .mock-bar b{display:block;white-space:nowrap;font-size:.74rem;font-weight:700;color:#111}
  .mock-bar span{display:block;white-space:nowrap;font-size:.6rem;color:#8a8a8a;margin-top:2px}
  .mock-bar .r{text-align:right}
  .mock-caption{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:8px}
  body.dragging::after{content:"";position:fixed;inset:10px;border:2px solid var(--red);pointer-events:none;z-index:50}

  /* ── loading ── */
  .loading{min-height:60vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:.9rem}
  .spinner{width:28px;height:28px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── editor ── */
  .editor{grid-template-columns:1fr;gap:0;padding:0 0 calc(150px + env(safe-area-inset-bottom));margin:0 -16px}
  .stage-wrap{background:var(--stage);border-bottom:1.5px solid var(--rule)}
  .lighttable{padding:clamp(16px,5vw,32px);display:flex;align-items:center;justify-content:center;min-height:220px}
  #preview{display:block;max-width:100%;max-height:60vh;width:auto;height:auto;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.12)}
  .stage-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .link{background:none;border:none;color:var(--ink);font-weight:700;font-size:.8rem;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--red)}
  .notice{margin:0 16px 12px;border-left:3px solid var(--red);background:#fff;padding:10px 12px;font-size:.84rem;color:var(--ink2)}

  .panels{display:flex;flex-direction:column;counter-reset:sec;padding:0 16px}
  .panel{padding:20px 0 18px;border-bottom:1px solid var(--line)}
  .panel:last-child{border-bottom:none}
  .panel h2{counter-increment:sec;font-size:.95rem;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
  .panel h2::before{content:counter(sec,decimal-leading-zero);font-size:.72rem;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
  .row-label{font-size:.88rem;font-weight:500}

  .seg{display:inline-flex;border:1.5px solid var(--ink)}
  .seg button{border:none;background:var(--bg);padding:7px 14px;font-size:.82rem;font-weight:600;color:var(--ink);white-space:nowrap}
  .seg button + button{border-left:1.5px solid var(--ink)}
  .seg button.on{background:var(--ink);color:var(--bg)}

  .field{display:grid;grid-template-columns:22px 86px 1fr;align-items:center;gap:8px;padding:4px 0}
  html[lang="zh-CN"] .field{grid-template-columns:22px 68px 1fr}
  .field-name{font-size:.82rem;color:var(--muted)}
  .field.off .field-input:not(:placeholder-shown){color:var(--dim);text-decoration:line-through}
  .field-input::placeholder,.adj input::placeholder{color:var(--dim)}
  .field-input,.adj input,.add{
    width:100%;min-width:0;height:40px;border:none;border-bottom:1.5px solid var(--line2);border-radius:0;background:transparent;padding:0 2px;
    font-size:16px; /* ≥16px stops iOS from zooming on focus */
  }
  .field-input:focus,.adj input:focus{outline:none;border-bottom-color:var(--ink)}
  .check{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:0;background:var(--bg);display:grid;place-items:center;margin:0;flex:none}
  .check:checked{background:var(--ink)}
  .check:checked::after{content:"";width:8px;height:4px;border:2px solid var(--bg);border-top:none;border-right:none;transform:rotate(-45deg) translate(1px,-1px)}
  .toggle{display:flex;align-items:center;gap:10px;font-size:.86rem;padding:8px 0}
  .adj{display:grid;grid-template-columns:1fr 104px 32px;gap:10px;align-items:end;margin-top:4px}
  .adj-remove{border:none;background:none;font-size:1.2rem;color:var(--muted);height:40px}
  .adj-remove:hover{color:var(--red)}
  .add{margin-top:12px;appearance:none;-webkit-appearance:none;border:1.5px dashed var(--line2);height:40px;padding:0 12px;font-weight:600;font-size:15px;cursor:pointer}
  .hint{font-size:.76rem;color:var(--muted);margin-top:10px}
  #outputInfo{font-variant-numeric:tabular-nums}

  /* ── action bar ── */
  .actionbar{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--rule);
  }
  body[data-stage="editor"] .actionbar{display:block}
  .actionbar-inner{max-width:560px;margin:0 auto}
  .primary,.secondary{
    display:flex;align-items:center;justify-content:center;width:100%;height:50px;font-weight:700;font-size:1rem;text-decoration:none;border:none;letter-spacing:-.01em;
  }
  #exportBtn{
    background:linear-gradient(90deg,var(--red) var(--progress,0%),var(--ink) var(--progress,0%));color:var(--bg);font-variant-numeric:tabular-nums;
  }
  #exportBtn:disabled{cursor:progress}
  #result{margin-bottom:0}
  #resultInfo{font-size:.76rem;color:var(--muted);text-align:center;margin-bottom:8px;font-variant-numeric:tabular-nums}
  .result-btns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
  #shareBtn{background:var(--red);color:#fff}
  .secondary{background:var(--bg);border:1.5px solid var(--ink);color:var(--ink)}
  #result .hint{text-align:center;margin-top:8px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;font-size:.84rem;max-width:min(92vw,520px);border-left:3px solid var(--red)}

  footer{font-size:.7rem;color:var(--dim);padding:16px;border-top:1px solid var(--line);max-width:1180px;margin:0 auto}
  body[data-stage="editor"] footer{display:none}

  @media (min-width:900px){
    .hero{grid-template-columns:1.1fr .9fr;align-items:center;gap:56px;padding:72px 0 80px}
    .editor{grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);align-items:start;margin:0;padding-top:24px;gap:32px}
    .stage-wrap{position:sticky;top:76px;border:1.5px solid var(--rule)}
    #preview{max-height:calc(100vh - 220px)}
    .panels{padding:0}
    .panel:first-child{padding-top:0}
    .actionbar{left:auto;right:max(16px,calc((100vw - 1180px)/2 + 16px));bottom:16px;width:min(400px,calc(100vw - 32px));border:1.5px solid var(--rule)}
  }
  @media (max-width:380px){
    .seg button{padding:7px 10px;font-size:.78rem}
    .field{grid-template-columns:22px 60px 1fr}
  }
</style>
</head>
<body data-stage="empty">

<header class="top">
  <div class="brand">Photo Frame</div>
  <div class="spacer"></div>
  <a class="back" href="../index.html" data-i18n="back">← Genghua</a>
  <button id="langBtn" class="lang" type="button" data-i18n="langToggle">中文</button>
</header>

<main>
  <section class="hero">
    <div class="hero-copy">
      <h1 data-i18n-html="heroTitle"></h1>
      <p data-i18n="heroBody"></p>
      <button class="pick-cta" type="button" data-pick data-i18n="pick"></button>
      <dl class="spec">
        <dt data-i18n="specFormats"></dt><dd data-i18n="formats"></dd>
        <dt data-i18n="specOutput"></dt><dd data-i18n="specOutputValue"></dd>
        <dt data-i18n="specPrivacy"></dt><dd data-i18n="privacy"></dd>
      </dl>
    </div>
    <button class="pick-card" type="button" data-pick tabindex="-1" aria-hidden="true">
      <div class="mock">
        <div class="mock-photo"></div>
        <div class="mock-bar">
          <div><b>Sony α7 V</b><span>FE 28-70mm F3.5-5.6 OSS II</span></div>
          <div class="r"><b>69mm f/5.6 1/1600s ISO 100</b><span>2026.09.29</span></div>
        </div>
      </div>
      <div class="mock-caption"><span>Fig. 1</span><span data-i18n="mockCaption"></span></div>
    </button>
  </section>

  <section class="loading" aria-live="polite">
    <div class="spinner"></div>
    <p data-i18n="loading"></p>
  </section>

  <section class="editor">
    <div class="stage-wrap">
      <div class="lighttable"><canvas id="preview" width="1" height="1"></canvas></div>
      <div class="stage-meta">
        <span id="sourceInfo"></span>
        <button class="link" type="button" data-pick data-i18n="pickAnother"></button>
      </div>
      <p id="noExif" class="notice" data-i18n="noExif" hidden></p>
    </div>

    <div class="panels">
      <section class="panel">
        <h2 data-i18n="sectionStyle"></h2>
        <div class="row">
          <span class="row-label" data-i18n="layout"></span>
          <div class="seg" data-bind="layout">
            <button type="button" data-value="bar" data-i18n="layoutBar"></button>
            <button type="button" data-value="center" data-i18n="layoutCenter"></button>
          </div>
        </div>
        <label class="toggle"><input type="checkbox" class="check" id="framed" checked><span data-i18n="framed"></span></label>
      </section>

      <section class="panel">
        <h2 data-i18n="sectionInfo"></h2>
        <div id="fields"></div>
        <label class="toggle" id="equivRow"><input type="checkbox" class="check" id="equivalentFocal" checked><span data-i18n="equivalentFocal"></span></label>
        <button class="link" type="button" id="resetInfo" data-i18n="resetInfo"></button>
      </section>

      <section class="panel">
        <h2 data-i18n="sectionAdjust"></h2>
        <label class="toggle"><input type="checkbox" class="check" id="showAdjust" checked><span data-i18n="showAdjust"></span></label>
        <div id="adjustList"></div>
        <p id="adjustEmpty" class="hint" data-i18n="adjustEmpty"></p>
        <select id="addAdjust" class="add"></select>
        <p class="hint" data-i18n="adjustHint"></p>
      </section>

      <section class="panel">
        <h2 data-i18n="sectionExport"></h2>
        <div class="row">
          <span class="row-label" data-i18n="size"></span>
          <div class="seg" data-bind="size">
            <button type="button" data-value="original" data-i18n="sizeOriginal"></button>
            <button type="button" data-value="4096">4096</button>
            <button type="button" data-value="2048">2048</button>
          </div>
        </div>
        <div class="row">
          <span class="row-label" data-i18n="quality"></span>
          <div class="seg" data-bind="quality">
            <button type="button" data-value="90" data-i18n="qualityStandard"></button>
            <button type="button" data-value="95" data-i18n="qualityHigh"></button>
            <button type="button" data-value="100" data-i18n="qualityMax"></button>
          </div>
        </div>
        <label class="toggle"><input type="checkbox" class="check" id="keepExif" checked><span data-i18n="keepExif"></span></label>
        <p id="outputInfo" class="hint"></p>
      </section>
    </div>
  </section>
</main>

<div class="actionbar">
  <div class="actionbar-inner">
    <div id="result" hidden>
      <p id="resultInfo"></p>
      <div class="result-btns">
        <button id="shareBtn" class="primary" type="button" data-i18n="save"></button>
        <a id="downloadBtn" class="secondary" href="#" data-i18n="download"></a>
      </div>
      <p class="hint" data-i18n="saveHint"></p>
    </div>
    <button id="exportBtn" class="primary" type="button"></button>
  </div>
</div>

<div id="toast" role="status" hidden></div>
<input type="file" id="fileInput" class="visually-hidden" accept="image/*,.heic,.heif,.avif" tabindex="-1" aria-hidden="true">

<footer data-i18n="footer"></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
