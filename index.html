<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional stock information and market data">
    <title>Stock Market Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <!-- Preload critical resources -->
    <link rel="preload" href="data/manifest.json" as="fetch" crossorigin>
</head>
<body>
    <!-- Header -->
    <header class="header" role="banner">
        <div class="container">
            <h1 class="header__title">Stocks</h1>
            <p class="header__subtitle">Professional market insights</p>
        </div>
    </header>

    <!-- Search Bar -->
    <section class="search-section" role="search">
        <div class="container">
            <div class="search-wrapper">
                <input
                    type="search"
                    id="search-input"
                    class="search-input"
                    placeholder="Search by company name or ticker..."
                    aria-label="Search stocks"
                    autocomplete="off"
                />
                <span class="search-icon" aria-hidden="true">🔍</span>
            </div>
        </div>
    </section>

    <!-- Category Filters -->
    <nav class="filters-section" role="navigation" aria-label="Stock categories">
        <div class="container">
            <div class="filters-wrapper" id="category-filters">
                <!-- Dynamically populated -->
                <button class="filter-btn active" data-category="all">All</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" role="main">
        <div class="container">
            <!-- Loading State -->
            <div class="loading-state" id="loading-state">
                <div class="spinner"></div>
                <p>Loading stocks...</p>
            </div>

            <!-- Empty State -->
            <div class="empty-state hidden" id="empty-state">
                <div class="empty-state__icon">📊</div>
                <h2 class="empty-state__title">No stocks found</h2>
                <p class="empty-state__message">Try adjusting your search or filters</p>
            </div>

            <!-- Stock Grid -->
            <div class="stock-grid" id="stock-grid">
                <!-- Dynamically populated stock cards -->
            </div>
        </div>
    </main>

    <!-- Stock Detail Modal -->
    <div class="modal hidden" id="stock-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__overlay" id="modal-overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="modal-close" aria-label="Close modal">×</button>
            <div class="modal__body" id="modal-body">
                <!-- Dynamically populated stock details -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p class="footer__text">Stock data for informational purposes only. Not investment advice.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/libs/marked.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
