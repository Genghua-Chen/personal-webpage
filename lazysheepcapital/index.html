<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Briefing</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, 0.82);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(20, 20, 22, 0.12);
      --accent: #2c65d8;
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, #ffffff 0%, #f1f1f3 38%, #e9e9ed 100%);
      min-height: 100vh;
      line-height: 1.45;
    }

    .app {
      width: min(1180px, 92vw);
      margin: 28px auto 44px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding: 30px;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.6rem, 2.8vw, 2.2rem);
      letter-spacing: -0.03em;
      font-weight: 650;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 70ch;
    }

    .toolbar {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .search-wrap {
      height: 48px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0 14px;
      display: flex;
      align-items: center;
    }

    .search-wrap input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.98rem;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 13px;
      cursor: pointer;
      color: var(--text);
      font-size: 0.84rem;
    }

    .chip.active {
      border-color: transparent;
      background: var(--text);
      color: #fff;
    }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .list-head {
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.8rem;
    }

    .stock-list {
      max-height: 72vh;
      overflow: auto;
    }

    .stock-row {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 12px 14px;
      cursor: pointer;
    }

    .stock-row:hover,
    .stock-row.active {
      background: rgba(255, 255, 255, 0.65);
    }

    .stock-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .symbol {
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .company {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .delta {
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .detail {
      padding: 20px;
    }

    .metrics {
      margin: 12px 0 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 10px;
    }

    .metric .label {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .metric .value {
      margin-top: 4px;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      letter-spacing: -0.01em;
      margin: 0.8em 0 0.45em;
    }

    .markdown p {
      margin: 0.5em 0;
      color: #2e2e33;
    }

    .markdown ul {
      margin: 0.5em 0;
      padding-left: 1.1em;
    }

    .empty {
      color: var(--muted);
      padding: 16px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .stock-list {
        max-height: 36vh;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 22px 16px;
      }
      .detail {
        padding: 16px;
      }
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Market Briefing</h1>
      <p>Professional stock snapshots with searchable company summaries, sector filters, and report content sourced from Markdown files.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <a href="smart_money.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#1d1d1f;color:#fff;border-radius:999px;font-size:0.84rem;font-weight:600;text-decoration:none;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 5v3.5L10 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Smart Money Tracker →
        </a>
        <a href="ai-capex-flow.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#0a1828;color:#00e5ff;border:1px solid rgba(0,229,255,.3);border-radius:999px;font-size:0.84rem;font-weight:600;text-decoration:none;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          AI Capex 流向图 →
        </a>
      </div>
      <div class="toolbar">
        <label class="search-wrap">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search by company or ticker (AAPL, NVIDIA, etc.)">
        </label>
        <div id="filterRow" class="filter-row"></div>
      </div>
    </section>

    <section class="grid">
      <aside class="panel">
        <div class="list-head">Stocks</div>
        <div id="stockList" class="stock-list"></div>
      </aside>
      <article class="panel detail">
        <div id="detailPane" class="empty">Select a stock on the left to view data and report.</div>
      </article>
    </section>
  </main>

  <script id="stockManifest" type="application/json">
    [
      "stocks/aapl.md",
      "stocks/msft.md",
      "stocks/nvda.md",
      "stocks/jnj.md",
      "stocks/unh.md"
    ]
  </script>

  <script>
    const state = {
      stocks: [],
      filtered: [],
      sector: "All",
      query: "",
      selectedSymbol: null
    };

    const elements = {
      search: document.getElementById("searchInput"),
      filterRow: document.getElementById("filterRow"),
      stockList: document.getElementById("stockList"),
      detailPane: document.getElementById("detailPane")
    };

    function textToHtmlSafe(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function markdownInlineToHtml(line) {
      return textToHtmlSafe(line)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    }

    function markdownToHtml(markdown) {
      const lines = markdown.split("\n");
      const htmlParts = [];
      let listOpen = false;

      for (const line of lines) {
        if (/^###\s+/.test(line)) {
          if (listOpen) {
            htmlParts.push("</ul>");
            listOpen = false;
          }
          htmlParts.push(`<h3>${textToHtmlSafe(line.replace(/^###\s+/, ""))}</h3>`);
        } else if (/^##\s+/.test(line)) {
          if (listOpen) {
            htmlParts.push("</ul>");
            listOpen = false;
          }
          htmlParts.push(`<h2>${textToHtmlSafe(line.replace(/^##\s+/, ""))}</h2>`);
        } else if (/^#\s+/.test(line)) {
          if (listOpen) {
            htmlParts.push("</ul>");
            listOpen = false;
          }
          htmlParts.push(`<h1>${textToHtmlSafe(line.replace(/^#\s+/, ""))}</h1>`);
        } else if (/^-\s+/.test(line)) {
          if (!listOpen) {
            htmlParts.push("<ul>");
            listOpen = true;
          }
          htmlParts.push(`<li>${markdownInlineToHtml(line.replace(/^-\s+/, ""))}</li>`);
        } else if (line.trim() === "") {
          if (listOpen) {
            htmlParts.push("</ul>");
            listOpen = false;
          }
        } else {
          if (listOpen) {
            htmlParts.push("</ul>");
            listOpen = false;
          }
          htmlParts.push(`<p>${markdownInlineToHtml(line)}</p>`);
        }
      }

      if (listOpen) {
        htmlParts.push("</ul>");
      }
      return htmlParts.join("");
    }

    function parseFrontMatterMarkdown(content) {
      const match = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (!match) return null;
      const metaRaw = match[1];
      const markdownBody = match[2];
      const meta = {};

      for (const line of metaRaw.split("\n")) {
        const idx = line.indexOf(":");
        if (idx === -1) continue;
        const key = line.slice(0, idx).trim();
        const value = line.slice(idx + 1).trim();
        meta[key] = value;
      }

      if (!meta.symbol || !meta.company || !meta.sector) return null;

      return {
        symbol: meta.symbol,
        company: meta.company,
        sector: meta.sector,
        tags: meta.tags || "",
        price: meta.price || "-",
        change: meta.change || "-",
        marketCap: meta.marketCap || "-",
        pe: meta.pe || "-",
        summary: meta.summary || "",
        reportDate: meta.reportDate || "-",
        markdown: markdownBody
      };
    }

    function normalize(text) {
      return String(text || "").toLowerCase();
    }

    function updateFiltered() {
      const q = normalize(state.query);
      state.filtered = state.stocks.filter((stock) => {
        const sectorOk = state.sector === "All" || stock.sector === state.sector;
        const queryOk =
          q === "" ||
          normalize(stock.symbol).includes(q) ||
          normalize(stock.company).includes(q) ||
          normalize(stock.tags).includes(q);
        return sectorOk && queryOk;
      });
    }

    function renderFilters() {
      const sectors = Array.from(new Set(state.stocks.map((s) => s.sector))).sort();
      const list = ["All", ...sectors];

      elements.filterRow.innerHTML = list
        .map((sector) => {
          const activeClass = state.sector === sector ? "active" : "";
          return `<button type="button" class="chip ${activeClass}" data-sector="${sector}">${sector}</button>`;
        })
        .join("");

      for (const chip of elements.filterRow.querySelectorAll(".chip")) {
        chip.addEventListener("click", () => {
          state.sector = chip.dataset.sector;
          updateFiltered();
          if (!state.filtered.some((s) => s.symbol === state.selectedSymbol)) {
            state.selectedSymbol = state.filtered[0] ? state.filtered[0].symbol : null;
          }
          renderFilters();
          renderStockList();
          renderDetail();
        });
      }
    }

    function renderStockList() {
      if (!state.filtered.length) {
        elements.stockList.innerHTML = '<div class="empty">No matching stocks.</div>';
        return;
      }

      elements.stockList.innerHTML = state.filtered
        .map((stock) => {
          const activeClass = stock.symbol === state.selectedSymbol ? "active" : "";
          return `
            <button type="button" class="stock-row ${activeClass}" data-symbol="${stock.symbol}">
              <div class="stock-top">
                <span class="symbol">${textToHtmlSafe(stock.symbol)}</span>
                <span class="delta">${textToHtmlSafe(stock.change)}</span>
              </div>
              <div class="company">${textToHtmlSafe(stock.company)}</div>
            </button>
          `;
        })
        .join("");

      for (const row of elements.stockList.querySelectorAll(".stock-row")) {
        row.addEventListener("click", () => {
          state.selectedSymbol = row.dataset.symbol;
          renderStockList();
          renderDetail();
        });
      }
    }

    function renderDetail() {
      const stock = state.stocks.find((s) => s.symbol === state.selectedSymbol);
      if (!stock) {
        elements.detailPane.innerHTML = "Select a stock on the left to view data and report.";
        return;
      }

      elements.detailPane.innerHTML = `
        <h2 style="margin:0 0 4px;">${textToHtmlSafe(stock.company)} <span style="color:#6e6e73;font-weight:500;">(${textToHtmlSafe(stock.symbol)})</span></h2>
        <p style="margin:0;color:#6e6e73;">${textToHtmlSafe(stock.summary)}</p>
        <div class="metrics">
          <div class="metric"><div class="label">Price</div><div class="value">${textToHtmlSafe(stock.price)}</div></div>
          <div class="metric"><div class="label">Change</div><div class="value">${textToHtmlSafe(stock.change)}</div></div>
          <div class="metric"><div class="label">Market Cap</div><div class="value">${textToHtmlSafe(stock.marketCap)}</div></div>
          <div class="metric"><div class="label">P/E</div><div class="value">${textToHtmlSafe(stock.pe)}</div></div>
        </div>
        <p class="meta">Sector: ${textToHtmlSafe(stock.sector)} | Report date: ${textToHtmlSafe(stock.reportDate)}</p>
        <div class="markdown">${markdownToHtml(stock.markdown)}</div>
      `;
    }

    async function loadStocks() {
      const manifestRaw = document.getElementById("stockManifest").textContent;
      const paths = JSON.parse(manifestRaw);
      const loaded = await Promise.all(paths.map(async (path) => {
        const response = await fetch(path);
        if (!response.ok) return null;
        const content = await response.text();
        const stock = parseFrontMatterMarkdown(content);
        return stock;
      }));
      return loaded.filter(Boolean);
    }

    function bindSearch() {
      elements.search.addEventListener("input", (event) => {
        state.query = event.target.value;
        updateFiltered();
        if (!state.filtered.some((s) => s.symbol === state.selectedSymbol)) {
          state.selectedSymbol = state.filtered[0] ? state.filtered[0].symbol : null;
        }
        renderStockList();
        renderDetail();
      });
    }

    async function start() {
      try {
        state.stocks = await loadStocks();
        updateFiltered();
        state.selectedSymbol = state.filtered[0] ? state.filtered[0].symbol : null;
        renderFilters();
        renderStockList();
        renderDetail();
        bindSearch();
      } catch (error) {
        elements.detailPane.innerHTML = "Unable to load markdown files. Open this page through a local web server.";
      }
    }

    start();
  </script>
</body>
</html>
