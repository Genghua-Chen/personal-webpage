<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0e0e1a"/>

  <!-- Ears (gradient, brand accent) -->
  <ellipse cx="7" cy="17" rx="3.6" ry="2.1" fill="url(#g)" transform="rotate(-24 7 17)"/>
  <ellipse cx="25" cy="17" rx="3.6" ry="2.1" fill="url(#g)" transform="rotate(24 25 17)"/>

  <!-- Face -->
  <ellipse cx="16" cy="19" rx="7" ry="7.2" fill="#c9cee8"/>

  <!-- Wool crown -->
  <circle cx="9.5"  cy="13"   r="3.1" fill="#f5f6fc"/>
  <circle cx="13"   cy="10.8" r="3.3" fill="#f5f6fc"/>
  <circle cx="16.2" cy="10.2" r="3.4" fill="#f5f6fc"/>
  <circle cx="19.5" cy="10.8" r="3.3" fill="#f5f6fc"/>
  <circle cx="22.5" cy="13"   r="3.1" fill="#f5f6fc"/>

  <!-- Eyes -->
  <circle cx="13.2" cy="19.5" r="1.3" fill="#1a1a2c"/>
  <circle cx="18.8" cy="19.5" r="1.3" fill="#1a1a2c"/>
  <circle cx="13.6" cy="19.1" r="0.45" fill="#fff"/>
  <circle cx="19.2" cy="19.1" r="0.45" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="16" cy="23" rx="1.3" ry="0.9" fill="#9aa0c4"/>
</svg>
