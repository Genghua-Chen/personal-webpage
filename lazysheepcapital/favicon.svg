<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0e0e1a"/>

  <!-- Wool (overlapping circles) -->
  <circle cx="11" cy="18" r="5.5" fill="#e8e8f0"/>
  <circle cx="17" cy="15.5" r="6"  fill="#e8e8f0"/>
  <circle cx="23" cy="18" r="5"   fill="#e8e8f0"/>
  <circle cx="16" cy="21" r="5"   fill="#e8e8f0"/>

  <!-- Head -->
  <ellipse cx="8" cy="16" rx="4" ry="4.5" fill="#1e1e30"/>

  <!-- Eye -->
  <circle cx="7" cy="15" r="1.1" fill="#e8e8f0"/>

  <!-- Legs -->
  <rect x="12" y="25" width="2.5" height="5" rx="1.2" fill="#1e1e30"/>
  <rect x="17.5" y="25" width="2.5" height="5" rx="1.2" fill="#1e1e30"/>

  <!-- Gradient accent dot on head -->
  <circle cx="7" cy="15" r="0.5" fill="url(#g)"/>
</svg>
