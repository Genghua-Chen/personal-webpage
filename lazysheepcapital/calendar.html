<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Calendar — LazySheepcapital</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(20,20,22,.09);
      --accent: #2c65d8;
      --shadow: 0 2px 16px rgba(0,0,0,.07);
      --radius: 16px;
      --c-earn: #2563eb;  --cb-earn: #dbeafe;
      --c-fomc: #dc2626;  --cb-fomc: #fee2e2;
      --c-13f:  #7c3aed;  --cb-13f:  #ede9fe;
      --c-econ: #059669;  --cb-econ: #d1fae5;
      --c-div:  #d97706;  --cb-div:  #fef3c7;
      --c-ipo:  #db2777;  --cb-ipo:  #fce7f3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; line-height: 1.45;
    }

    .app { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }

    /* ── nav ── */
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .84rem; color: var(--accent); text-decoration: none;
      margin-bottom: 16px;
    }
    .back-link:hover { text-decoration: underline; }

    /* ── hero ── */
    .hero {
      background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
      padding: 24px 28px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .hero h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: 4px; }
    .hero p  { font-size: .9rem; color: var(--muted); }

    /* ── filter chips ── */
    .filters {
      display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; align-items: center;
    }
    .fc {
      border: 1.5px solid var(--line); background: var(--panel);
      border-radius: 999px; padding: 6px 14px; cursor: pointer;
      font-size: .8rem; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
      transition: all .14s;
    }
    .fc .dot { width: 8px; height: 8px; border-radius: 50%; }
    .fc.active { color: #fff; border-color: transparent; }
    .fc.active.earn { background: var(--c-earn); }
    .fc.active.fomc { background: var(--c-fomc); }
    .fc.active.f13f { background: var(--c-13f); }
    .fc.active.econ { background: var(--c-econ); }
    .fc.active.div  { background: var(--c-div);  }

    /* ── main layout ── */
    .main { display: grid; grid-template-columns: 1fr 310px; gap: 14px; }

    /* ── calendar ── */
    .cal-panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px; border-bottom: 1px solid var(--line);
    }
    .cal-nav-title { font-size: 1.1rem; font-weight: 700; }
    .cal-nav-btns  { display: flex; gap: 8px; }
    .nav-btn {
      border: 1px solid var(--line); background: transparent; border-radius: 8px;
      padding: 5px 10px; cursor: pointer; font-size: .82rem; color: var(--text);
      transition: background .12s;
    }
    .nav-btn:hover { background: var(--bg); }
    .nav-btn.today { color: var(--accent); font-weight: 600; }

    .weekdays {
      display: grid; grid-template-columns: repeat(7,1fr);
      padding: 0 12px; border-bottom: 1px solid var(--line);
    }
    .wd {
      text-align: center; font-size: .72rem; font-weight: 600;
      color: var(--muted); letter-spacing: .05em; padding: 8px 0;
    }
    .wd.weekend { color: var(--c-fomc); }

    .grid {
      display: grid; grid-template-columns: repeat(7,1fr);
      gap: 0; padding: 8px 12px 12px;
    }
    .day {
      min-height: 88px; border-radius: 10px; padding: 6px 7px 5px;
      cursor: pointer; position: relative;
      transition: background .12s;
    }
    .day:hover { background: var(--bg); }
    .day.other-month .day-num { opacity: .3; }
    .day.today .day-num {
      background: var(--accent); color: #fff;
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .day.selected { background: #f0f4ff; outline: 1.5px solid var(--accent); }
    .day-num { font-size: .82rem; font-weight: 600; margin-bottom: 4px; display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; }
    .day.weekend .day-num { color: var(--c-fomc); }
    .day.weekend.today .day-num { background: var(--c-fomc); color: #fff; }

    .event-pills { display: flex; flex-direction: column; gap: 2px; }
    .ep {
      border-radius: 4px; padding: 1px 5px;
      font-size: .68rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .ep.earn { background: var(--cb-earn); color: var(--c-earn); }
    .ep.fomc { background: var(--cb-fomc); color: var(--c-fomc); }
    .ep.f13f { background: var(--cb-13f);  color: var(--c-13f);  }
    .ep.econ { background: var(--cb-econ); color: var(--c-econ); }
    .ep.div  { background: var(--cb-div);  color: var(--c-div);  }
    .ep.more { background: var(--bg); color: var(--muted); }

    /* ── sidebar ── */
    .sidebar { display: flex; flex-direction: column; gap: 10px; }

    .side-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .side-head {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      font-size: .78rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); font-weight: 600;
    }
    .side-list { max-height: 420px; overflow-y: auto; }

    .ev-item {
      display: flex; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      transition: background .1s; cursor: default;
    }
    .ev-item:last-child { border-bottom: 0; }
    .ev-item:hover { background: var(--bg); }
    .ev-dot-col { padding-top: 3px; flex-shrink: 0; }
    .ev-dot {
      width: 10px; height: 10px; border-radius: 50%; display: block;
    }
    .ev-dot.earn { background: var(--c-earn); }
    .ev-dot.fomc { background: var(--c-fomc); }
    .ev-dot.f13f { background: var(--c-13f);  }
    .ev-dot.econ { background: var(--c-econ); }
    .ev-dot.div  { background: var(--c-div);  }
    .ev-content { flex: 1; min-width: 0; }
    .ev-date  { font-size: .72rem; color: var(--muted); margin-bottom: 1px; }
    .ev-title { font-size: .85rem; font-weight: 600; }
    .ev-desc  { font-size: .76rem; color: var(--muted); margin-top: 1px; line-height: 1.4; }
    .ev-badge {
      font-size: .69rem; font-weight: 700; border-radius: 4px;
      padding: 1px 6px; display: inline-block; margin-top: 3px;
    }
    .ev-badge.earn { background: var(--cb-earn); color: var(--c-earn); }
    .ev-badge.fomc { background: var(--cb-fomc); color: var(--c-fomc); }
    .ev-badge.f13f { background: var(--cb-13f);  color: var(--c-13f);  }
    .ev-badge.econ { background: var(--cb-econ); color: var(--c-econ); }
    .ev-badge.div  { background: var(--cb-div);  color: var(--c-div);  }
    .ev-time-badge {
      font-size: .67rem; font-weight: 700; border-radius: 3px;
      padding: 1px 5px; display: inline-block; margin-top: 3px; margin-left: 4px;
    }
    .ev-time-badge.bmo { background: #fef3c7; color: #b45309; }
    .ev-time-badge.amc { background: #e0e7ff; color: #4338ca; }

    .empty-side { padding: 20px 16px; font-size: .85rem; color: var(--muted); }

    /* legend */
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 10px 16px; border-top: 1px solid var(--line);
      background: rgba(0,0,0,.02);
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--muted); }
    .leg-dot { width: 9px; height: 9px; border-radius: 50%; }

    @media(max-width:900px){
      .main { grid-template-columns: 1fr; }
      .side-list { max-height: 260px; }
    }
  </style>
</head>

/* ═══════════════════════════════════
   CSV PARSER (minimal)
   ═══════════════════════════════════ */
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const vals = line.split(",");
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || "").trim(); });
    return obj;
  });
}

/* ═══════════════════════════════════
   APP STATE
   ═══════════════════════════════════ */
const today = new Date();
today.setHours(0,0,0,0);
const todayStr = fmtDate(today);

let curYear  = today.getFullYear();
let curMonth = today.getMonth();   // 0-indexed
let selected = todayStr;

// Active filters (all on by default)
const filters = { earn:true, fomc:true, f13f:true, econ:true, div:true };

/* ═══════════════════════════════════
   HELPERS
   ═══════════════════════════════════ */
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseDate(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y,m-1,d);
}
function visibleEvents() {
  return EVENTS.filter(e => filters[e.t]);
}
function eventsOn(dateStr) {
  return visibleEvents().filter(e => e.d === dateStr);
}
function upcomingEvents(n=25) {
  const now = todayStr;
  return visibleEvents()
    .filter(e => e.d >= now)
    .sort((a,b)=>a.d.localeCompare(b.d))
    .slice(0,n);
}
function typeLabel(t) {
  return {earn:"财报",fomc:"FOMC",f13f:"13F",econ:"经济数据",div:"股息"}[t]||t;
}
function fmtDisplayDate(s) {
  const d = parseDate(s);
  const days = ["日","一","二","三","四","五","六"];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 周${days[d.getDay()]}`;
}

/* ═══════════════════════════════════
   RENDER FILTERS
   ═══════════════════════════════════ */
function renderFilters() {
  const defs = [
    {k:"earn",label:"财报",cls:"earn"},
    {k:"fomc",label:"FOMC 会议",cls:"fomc"},
    {k:"f13f",label:"13F 截止",cls:"f13f"},
    {k:"econ",label:"经济数据",cls:"econ"},
    {k:"div", label:"股息除息",cls:"div"},
  ];
  const wrap = document.getElementById("filters");
  wrap.innerHTML = defs.map(f=>`
    <button class="fc ${f.cls}${filters[f.k]?" active":""}" data-key="${f.k}">
      <span class="dot" style="background:var(--c-${f.cls})"></span>${f.label}
    </button>
  `).join("") +
  `<span style="font-size:.78rem;color:var(--muted);margin-left:4px">点击筛选类型</span>`;

  wrap.querySelectorAll(".fc").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const k = btn.dataset.key;
      filters[k] = !filters[k];
      renderFilters();
      renderCalendar();
      renderSidebar();
    });
  });
}

/* ═══════════════════════════════════
   RENDER CALENDAR
   ═══════════════════════════════════ */
function renderCalendar() {
  const MONTHS = ["一月","二月","三月","四月","五月","六月",
                  "七月","八月","九月","十月","十一月","十二月"];
  document.getElementById("calTitle").textContent =
    `${curYear}年 ${MONTHS[curMonth]}`;

  const grid = document.getElementById("calGrid");
  const firstDay = new Date(curYear, curMonth, 1);
  const lastDay  = new Date(curYear, curMonth+1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const daysInMonth = lastDay.getDate();

  const cells = [];
  // Leading blank days (from prev month)
  const prevLast = new Date(curYear, curMonth, 0);
  for(let i=startDow-1; i>=0; i--){
    cells.push({date:new Date(curYear,curMonth-1,prevLast.getDate()-i), other:true});
  }
  // Current month
  for(let d=1; d<=daysInMonth; d++){
    cells.push({date:new Date(curYear,curMonth,d), other:false});
  }
  // Trailing days
  const trailCount = (7 - cells.length%7) % 7;
  for(let d=1; d<=trailCount; d++){
    cells.push({date:new Date(curYear,curMonth+1,d), other:true});
  }

  grid.innerHTML = cells.map(c=>{
    const ds = fmtDate(c.date);
    const dow = c.date.getDay();
    const isToday = ds === todayStr;
    const isSel   = ds === selected;
    const isWknd  = dow===0||dow===6;
    const evs = eventsOn(ds);

    const pills = evs.slice(0,3).map(e=>{
      const timePrefix = e.earTime === "BMO" ? "▲ " : e.earTime === "AMC" ? "▼ " : "";
      return `<div class="ep ${e.t}" title="${e.title}">${timePrefix}${e.title}</div>`;
    }).join("");
    const more = evs.length>3 ? `<div class="ep more">+${evs.length-3}</div>` : "";

    return `
      <div class="day${c.other?" other-month":""}${isToday?" today":""}${isSel?" selected":""}${isWknd?" weekend":""}"
           data-date="${ds}">
        <span class="day-num">${c.date.getDate()}</span>
        <div class="event-pills">${pills}${more}</div>
      </div>`;
  }).join("");

  grid.querySelectorAll(".day").forEach(el=>{
    el.addEventListener("click",()=>{
      selected = el.dataset.date;
      renderCalendar();
      renderSidebar();
    });
  });
}

/* ═══════════════════════════════════
   RENDER SIDEBAR
   ═══════════════════════════════════ */
function renderSidebar() {
  const selEvs = eventsOn(selected);
  const head  = document.getElementById("sideHead");
  const list  = document.getElementById("sideList");

  if(selEvs.length){
    head.textContent = fmtDisplayDate(selected) + " 的事件";
    list.innerHTML = selEvs.map(e=>{
      const timeBadge = e.earTime
        ? `<span class="ev-time-badge ${e.earTime === "BMO" ? "bmo" : "amc"}">${e.earTime === "BMO" ? "▲ 盘前" : "▼ 盘后"}</span>`
        : "";
      return `
      <div class="ev-item">
        <div class="ev-dot-col"><span class="ev-dot ${e.t}"></span></div>
        <div class="ev-content">
          <div class="ev-title">${e.title}</div>
          <div class="ev-desc">${e.desc}</div>
          <span class="ev-badge ${e.t}">${typeLabel(e.t)}</span>${timeBadge}
        </div>
      </div>`;
    }).join("");
  } else {
    head.textContent = "近期事件";
    const ups = upcomingEvents(30);
    if(!ups.length){
      list.innerHTML = `<div class="empty-side">暂无符合条件的事件。</div>`;
    } else {
      list.innerHTML = ups.map(e=>{
        const timeBadge = e.earTime
          ? `<span class="ev-time-badge ${e.earTime === "BMO" ? "bmo" : "amc"}">${e.earTime === "BMO" ? "▲ 盘前" : "▼ 盘后"}</span>`
          : "";
        return `
        <div class="ev-item">
          <div class="ev-dot-col"><span class="ev-dot ${e.t}"></span></div>
          <div class="ev-content">
            <div class="ev-date">${fmtDisplayDate(e.d)}</div>
            <div class="ev-title">${e.title}</div>
            <div class="ev-desc">${e.desc}</div>
            <span class="ev-badge ${e.t}">${typeLabel(e.t)}</span>${timeBadge}
          </div>
        </div>`;
      }).join("");
    }
  }
}

/* ═══════════════════════════════════
   CONTROLS
   ═══════════════════════════════════ */
document.getElementById("btnPrev").addEventListener("click",()=>{
  curMonth--;
  if(curMonth<0){curMonth=11;curYear--;}
  renderCalendar(); renderSidebar();
});
document.getElementById("btnNext").addEventListener("click",()=>{
  curMonth++;
  if(curMonth>11){curMonth=0;curYear++;}
  renderCalendar(); renderSidebar();
});
document.getElementById("btnToday").addEventListener("click",()=>{
  curYear=today.getFullYear(); curMonth=today.getMonth();
  selected=todayStr;
  renderCalendar(); renderSidebar();
});

/* ── LOAD EARNINGS FROM CSV THEN BOOT ── */
async function loadEarnings() {
  try {
    const res = await fetch("data/earnings_dates.csv");
    if (!res.ok) return;
    const rows = parseCSV(await res.text());
    rows.forEach(r => {
      if (!r.report_date || !r.ticker) return;
      const statusLabel = r.status === "reported" ? " ✓" : r.status === "confirmed" ? " 📌" : "";
      EVENTS.push({
        d: r.report_date,
        t: "earn",
        earTime: r.time,
        title: `${r.ticker} 财报${statusLabel}`,
        desc:  `${r.company} ${r.fiscal_quarter}${r.notes ? " · " + r.notes : ""}`,
      });
    });
  } catch(e) { /* file not available in local open */ }
  renderFilters();
  renderCalendar();
  renderSidebar();
}

loadEarnings();
</script>
