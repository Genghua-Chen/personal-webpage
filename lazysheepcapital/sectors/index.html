<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>板块涨跌 — LazySheepcapital</title>
  <script src="../i18n.js"></script>
  <script src="i18n-en.js"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    :root{
      --bg:#07070f;--panel:rgba(255,255,255,.035);--panel-h:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.16);
      --text:#e8e8f0;--muted:rgba(200,200,230,.55);--dim:rgba(200,200,230,.3);
      --up:#22c55e;--up-s:#4ade80;--down:#f43f5e;--down-s:#fb7185;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;font-variant-numeric:tabular-nums}

    /* ── NAV ── */
    .site-nav{position:sticky;top:0;z-index:300;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;height:52px;background:rgba(7,7,15,.88);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.08);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    .site-nav .sn-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;letter-spacing:-.02em;color:#e8e8f0;text-decoration:none;white-space:nowrap}
    .site-nav .sn-links{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
    .site-nav .sn-link{padding:5px 11px;border-radius:8px;font-size:.78rem;color:rgba(200,200,230,.5);text-decoration:none;border:1px solid transparent;transition:all .15s;white-space:nowrap}
    .site-nav .sn-link:hover{color:#e8e8f0;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
    .site-nav .sn-link.active{color:#e8e8f0;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
    @media(max-width:680px){.site-nav{height:auto;padding:8px 14px;flex-wrap:wrap}.site-nav .sn-links{justify-content:flex-start}}

    .wrap{max-width:1240px;margin:0 auto;padding:28px 28px 80px}
    .up{color:var(--up-s)} .down{color:var(--down-s)} .flat{color:var(--muted)}

    /* ── HEADER ── */
    .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
    .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
    .eyebrow .dot.live{background:#fbbf24;animation:pulse 1.6s infinite}
    @keyframes pulse{50%{opacity:.3}}
    h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;letter-spacing:-.04em;line-height:1.1}
    .summary{margin-top:10px;font-size:.95rem;color:var(--muted);max-width:70ch;line-height:1.7}
    .summary b{color:var(--text);font-weight:700}
    .summary b.up{color:var(--up-s)} .summary b.down{color:var(--down-s)}

    /* ── INDEX TILES ── */
    .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:34px}
    .tile{position:relative;border:1px solid var(--border);border-radius:16px;padding:16px 18px 10px;overflow:hidden;background:var(--panel)}
    .tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--tint) 0%,transparent 75%);opacity:.5;pointer-events:none}
    .tile .t-top{display:flex;justify-content:space-between;align-items:baseline;position:relative}
    .tile .t-name{font-size:.82rem;color:var(--muted);font-weight:600}
    .tile .t-sym{font-size:.7rem;color:var(--dim);font-weight:700;letter-spacing:.06em}
    .tile .t-chg{font-size:2.1rem;font-weight:800;letter-spacing:-.04em;line-height:1.15;margin-top:4px;position:relative}
    .tile .t-px{font-size:.78rem;color:var(--dim);position:relative}
    .tile svg{display:block;width:100%;height:48px;margin-top:6px;position:relative}

    /* ── SECTION ── */
    .sec{margin-bottom:40px}
    .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
    .sec-title{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
    .sec-title small{font-size:.75rem;color:var(--dim);font-weight:600;letter-spacing:.06em;margin-left:8px;text-transform:uppercase}
    .card{border:1px solid var(--border);border-radius:18px;background:var(--panel);padding:18px}
    .two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}

    /* diverging bars */
    .bars{display:flex;flex-direction:column;gap:5px}
    .bar-row{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;font-size:.86rem;cursor:default;border-radius:6px;padding:2px 4px}
    .bar-row:hover{background:var(--panel-h)}
    .bar-row .bl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-row .bl span{color:var(--dim);font-size:.7rem;margin-left:5px;font-weight:700}
    .track{position:relative;height:20px}
    .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-h)}
    .fill{position:absolute;top:2px;bottom:2px;border-radius:4px}
    .fill.pos{left:50%;background:linear-gradient(90deg,rgba(34,197,94,.55),var(--up))}
    .fill.neg{right:50%;background:linear-gradient(270deg,rgba(244,63,94,.55),var(--down))}
    .bar-row .bv{text-align:right;font-weight:800}

    /* toggle */
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;background:rgba(0,0,0,.25)}
    .seg button{all:unset;cursor:pointer;font-size:.78rem;padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:600}
    .seg button.on{background:rgba(255,255,255,.1);color:var(--text)}

    /* chart */
    .chart{position:relative;width:100%;height:340px}
    .chart svg{display:block;width:100%;height:100%;overflow:visible}
    .chart .tip{position:absolute;pointer-events:none;background:rgba(14,14,26,.95);border:1px solid var(--border-h);border-radius:10px;padding:8px 10px;font-size:.75rem;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;z-index:5}
    .chart .tip .tt{color:var(--muted);margin-bottom:4px;font-weight:700}
    .chart .tip .tr{display:flex;justify-content:space-between;gap:12px;line-height:1.55}
    .chart .tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
    .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .lg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:4px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text);transition:opacity .15s,border-color .15s}
    .lg:hover{border-color:var(--border-h)}
    .lg .sw{width:9px;height:9px;border-radius:3px}
    .lg.off{opacity:.3}
    .lg b{font-weight:800}

    /* heatmap */
    .heat{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .ht{all:unset;cursor:pointer;border-radius:14px;padding:14px 14px 8px;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
    .ht:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
    .ht .hn{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ht .he{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ht .hv{font-size:1.75rem;font-weight:800;letter-spacing:-.04em;margin-top:6px;color:#fff}
    .ht .hc{font-size:.72rem;color:rgba(255,255,255,.65)}
    .ht svg{display:block;width:100%;height:30px;margin-top:4px}

    /* movers */
    .movers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .mv-h{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-bottom:8px;text-transform:uppercase}
    .mv{display:grid;grid-template-columns:26px 1fr 90px 70px;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);font-size:.86rem}
    .mv:last-child{border-bottom:0}
    .mv .rk{color:var(--dim);font-weight:700;font-size:.75rem}
    .mv .nm b{font-weight:800;letter-spacing:.02em}
    .mv .nm span{color:var(--muted);font-size:.78rem;margin-left:6px}
    .mv .nm em{font-style:normal;color:var(--dim);font-size:.7rem;margin-left:6px}
    .mv svg{width:90px;height:26px;display:block}
    .mv .v{text-align:right;font-weight:800;font-size:.98rem}

    /* group detail */
    .groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .grp{border:1px solid var(--border);border-radius:18px;background:var(--panel);padding:16px 16px 10px;scroll-margin-top:70px;transition:box-shadow .4s,border-color .4s}
    .grp.flash{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
    .grp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
    .grp-h .gn{font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
    .grp-h .ge{font-size:.68rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
    .grp-h .gv{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;text-align:right;line-height:1.1}
    .grp-h .gc{font-size:.7rem;color:var(--muted);text-align:right}
    .breadth{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:2px 0 8px;background:var(--border)}
    .breadth i{display:block}
    .st{display:grid;grid-template-columns:minmax(0,1.3fr) 76px minmax(0,1fr) 62px;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:.84rem}
    .st .sn b{font-weight:800;letter-spacing:.02em}
    .st .sn span{color:var(--muted);font-size:.76rem;margin-left:6px}
    .st svg{width:76px;height:22px;display:block}
    .st .track{height:14px}
    .st .fill{top:1px;bottom:1px}
    .st .sv{text-align:right;font-weight:800}

    /* etf strip */
    .etfs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
    .etf{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--panel)}
    .etf .es{font-weight:800;font-size:.85rem}
    .etf .en{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .etf .ev{font-weight:800;font-size:1.1rem;margin-top:2px}

    .foot{margin-top:30px;font-size:.76rem;color:var(--dim);line-height:1.8;border-top:1px solid var(--border);padding-top:16px}
    .err{padding:60px 20px;text-align:center;color:var(--muted)}

    /* date replay nav */
    .dnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .dbtn{font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
    a.dbtn:hover{border-color:var(--border-h);background:var(--panel-h)}
    .dbtn.off{color:var(--dim);cursor:default}
    .dbtn.now{border-color:rgba(167,139,250,.45);color:#c4b5fd}
    .dsel{font:inherit;font-size:.8rem;font-weight:600;padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:#11111d;color:var(--text);cursor:pointer}

    @media(max-width:1000px){.two{grid-template-columns:1fr}.heat{grid-template-columns:repeat(3,1fr)}.etfs{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.groups,.movers{grid-template-columns:1fr}.heat{grid-template-columns:repeat(2,1fr)}.wrap{padding:20px 14px 60px}.chart{height:280px}}
    html[lang=en] .he, html[lang=en] .ge { display: none; }
    html[lang=en] .bar-row { grid-template-columns: 136px 1fr 64px; }
    /* phones: let the movers / ETF grids shrink instead of pushing the page sideways */
    .mv .nm{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .movers>.card{min-width:0}
    @media(max-width:520px){.mv{grid-template-columns:20px minmax(0,1fr) 56px 60px;gap:8px}.mv svg{width:56px}.mv .nm em{display:none}.etfs{grid-template-columns:repeat(2,1fr)}}
  </style>
  <script>(function(){var p=location.pathname,c=p.replace(/\/index\.html$/,"/").replace(/\.html$/,"");if(c!==p)history.replaceState(null,"",c+location.search+location.hash)})()</script>

<body>
  <nav class="site-nav"><a class="sn-logo" href="../">LazySheepcapital</a><div class="sn-links"><a href="../smart_money/" class="sn-link">聪明钱追踪</a><a href="../sectors/" class="sn-link active">板块涨跌</a><a href="../ai-capex-flow/" class="sn-link">AI 流向图</a><a href="../space-flow/" class="sn-link">太空板块</a><a href="../physical-ai-flow/" class="sn-link">物理AI</a><a href="../calendar/" class="sn-link">财报日历</a><a href="../candlesticks/" class="sn-link">蜡烛图</a><a href="../cut-loss/" class="sn-link">割肉自查</a><a href="../track-record/" class="sn-link">实盘记录</a></div></nav>

  <main class="wrap" id="app"><div class="err">加载中…</div></main>

<script>
(async function () {
  const app = document.getElementById("app");
  const getJSON = u => fetch(u, { cache: "no-cache" }).then(r => { if (!r.ok) throw r.status; return r.json(); });
  // ?date=YYYY-MM-DD → 回放 data/sectors_archive/ 里那天的存档；不带参数 → 最新数据
  const want = new URLSearchParams(location.search).get("date");
  let D, latest, dates = [];
  try {
    [latest, dates] = await Promise.all([
      getJSON("../data/sectors.json"),
      getJSON("../data/sectors_archive/index.json").then(j => j.dates || []).catch(() => []),
    ]);
  } catch (e) {
    app.innerHTML = '<div class="err">数据加载失败，请稍后再试。</div>'; return;
  }
  if (!dates.includes(latest.date)) dates = [latest.date, ...dates].sort().reverse();
  const replay = !!want && want !== latest.date;
  if (!replay) D = latest;
  else {
    try { D = await getJSON(`../data/sectors_archive/${encodeURIComponent(want)}.json`); }
    catch (e) {
      app.innerHTML = `<div class="err">没有 ${String(want).replace(/[<>&"]/g, "")} 的存档。<br><br><a href="./" style="color:#60a5fa">回到最新</a></div>`; return;
    }
    // 存档里分时的 x 是「距开盘分钟数」，还原成时间戳
    const fix = r => { if (r.intraday) r.intraday = r.intraday.map(([m, v]) => [D.t0 + m * 60, v]); };
    [...D.indices, ...D.sectors, ...D.tech_etfs].forEach(fix);
    D.tech_groups.forEach(g => { fix(g); g.stocks.forEach(fix); });
  }

  /* ── helpers ── */
  const cls = v => v > 0.005 ? "up" : v < -0.005 ? "down" : "flat";
  const pct = (v, d = 2) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const UP = "#22c55e", DOWN = "#f43f5e";
  const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
  const et = t => etFmt.format(new Date(t * 1000));
  const md = s => s.slice(5).replace("-", "/");
  const en = s => window.I18N ? I18N.tr(s) : s;
  // 热力底色：涨绿跌红，|3%| 封顶
  const heatBg = v => {
    const a = Math.min(Math.abs(v) / 3, 1);
    const [r, g, b] = v >= 0 ? [22, 163, 74] : [225, 29, 72];
    return `linear-gradient(160deg, rgba(${r},${g},${b},${0.22 + a * 0.6}), rgba(${r},${g},${b},${0.08 + a * 0.3}))`;
  };

  // 迷你走势：0 轴虚线 + 面积填充
  function spark(points, w = 100, h = 30) {
    if (!points || points.length < 2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
    const ys = points.map(p => p[1]);
    const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1;
    const X = i => (i / (points.length - 1)) * w, Y = v => h - 2 - ((v - lo) / span) * (h - 4);
    const last = ys[ys.length - 1], c = last >= 0 ? UP : DOWN, id = "g" + Math.random().toString(36).slice(2, 8);
    const line = ys.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join("");
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
      <path d="${line}L${w} ${Y(0)}L0 ${Y(0)}Z" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>`;
  }

  function bar(v, max) {
    const w = Math.min(Math.abs(v) / max, 1) * 50;
    return `<div class="track"><div class="fill ${v >= 0 ? "pos" : "neg"}" style="width:${w}%"></div></div>`;
  }

  /* ── 多线图：hover 十字线 + 排序 tooltip，legend 可开关 / 高亮 ── */
  const PALETTE = ["#60a5fa", "#f472b6", "#fbbf24", "#34d399", "#a78bfa", "#f87171", "#22d3ee", "#fb923c", "#a3e635", "#e879f9", "#94a3b8"];
  function lineChart(el, legendEl, series, mode) {
    const hidden = new Set(), state = { focus: null };
    // 统一 x 轴：分时用时间戳，月线用日期
    const xs = [...new Set(series.flatMap(s => s.points.map(p => p[0])))].sort((a, b) => a < b ? -1 : 1);
    const xi = new Map(xs.map((x, i) => [x, i]));
    function draw() {
      const W = el.clientWidth, H = el.clientHeight, L = 46, R = 58, T = 10, B = 26;
      const vis = series.filter(s => !hidden.has(s.name));
      const ys = vis.flatMap(s => s.points.map(p => p[1])).concat(0);
      let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.08 || 0.5; lo -= pad; hi += pad;
      const X = i => L + (i / Math.max(xs.length - 1, 1)) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
      // y 网格
      const step = [0.25, 0.5, 1, 2, 2.5, 5, 10, 20].find(s => (hi - lo) / s <= 6) || 50;
      let g = "";
      for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
        const y = Y(v).toFixed(1);
        g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${Math.abs(v) < 1e-9 ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.06)"}" ${Math.abs(v) < 1e-9 ? 'stroke-dasharray="4 4"' : ""}/>`;
        g += `<text x="${L - 8}" y="${+y + 4}" text-anchor="end" fill="rgba(200,200,230,.4)" font-size="11">${v > 0 ? "+" : ""}${+v.toFixed(2)}%</text>`;
      }
      // x 刻度
      const nT = Math.min(6, xs.length);
      for (let k = 0; k < nT; k++) {
        const i = Math.round(k * (xs.length - 1) / Math.max(nT - 1, 1));
        g += `<text x="${X(i)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === nT - 1 ? "end" : "middle"}" fill="rgba(200,200,230,.4)" font-size="11">${mode === "intraday" ? et(xs[i]) : md(xs[i])}</text>`;
      }
      // 线 + 末端标签（防重叠）
      const ends = [];
      const paths = vis.map(s => {
        const d = s.points.map((p, k) => (k ? "L" : "M") + X(xi.get(p[0])).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
        const lp = s.points[s.points.length - 1];
        ends.push({ s, y: Y(lp[1]), v: lp[1], x: X(xi.get(lp[0])) });
        const f = state.focus, dim = f && f !== s.name;
        return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${f === s.name ? 3 : s.bold ? 2.6 : 1.8}" stroke-opacity="${dim ? 0.12 : 1}" stroke-linejoin="round"/>`;
      }).join("");
      ends.sort((a, b) => a.y - b.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      const labels = ends.map(e => {
        const dim = state.focus && state.focus !== e.s.name;
        return `<circle cx="${e.x}" cy="${Y(e.v)}" r="3" fill="${e.s.color}" opacity="${dim ? .15 : 1}"/><text x="${W - R + 6}" y="${e.y + 4}" fill="${e.s.color}" font-size="11" font-weight="700" opacity="${dim ? .2 : 1}">${pct(e.v, 1)}</text>`;
      }).join("");
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}${paths}${labels}<line class="cx" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.35)" opacity="0"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip"></div>`;
      const svg = el.querySelector("svg"), cx = svg.querySelector(".cx"), tip = el.querySelector(".tip");
      svg.addEventListener("mousemove", ev => {
        const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left;
        if (mx < L || mx > W - R) { cx.setAttribute("opacity", 0); tip.style.opacity = 0; return; }
        const i = Math.round((mx - L) / (W - L - R) * (xs.length - 1)), x = xs[i];
        cx.setAttribute("x1", X(i)); cx.setAttribute("x2", X(i)); cx.setAttribute("opacity", 1);
        const rows = vis.map(s => { let v = null; for (const p of s.points) { if (p[0] <= x) v = p[1]; else break; } return { s, v }; })
          .filter(r => r.v != null).sort((a, b) => b.v - a.v);
        tip.innerHTML = `<div class="tt">${mode === "intraday" ? et(x) + " ET" : x}</div>` + rows.map(r =>
          `<div class="tr"><span><i class="sw" style="background:${r.s.color}"></i>${esc(r.s.name)}</span><b class="${cls(r.v)}">${pct(r.v)}</b></div>`).join("");
        tip.style.opacity = 1;
        const tx = X(i) + 14 + tip.offsetWidth > W ? X(i) - 14 - tip.offsetWidth : X(i) + 14;
        tip.style.left = tx + "px"; tip.style.top = Math.max(0, ev.clientY - r.top - tip.offsetHeight / 2) + "px";
      });
      svg.addEventListener("mouseleave", () => { cx.setAttribute("opacity", 0); tip.style.opacity = 0; });
    }
    function legend() {
      const last = s => s.points.length ? s.points[s.points.length - 1][1] : 0;
      legendEl.innerHTML = [...series].sort((a, b) => last(b) - last(a)).map(s =>
        `<button class="lg${hidden.has(s.name) ? " off" : ""}" data-n="${esc(s.name)}"><i class="sw" style="background:${s.color}"></i>${esc(s.name)} <b class="${cls(last(s))}">${pct(last(s))}</b></button>`).join("");
      legendEl.querySelectorAll(".lg").forEach(b => {
        b.onclick = () => { const n = b.dataset.n; hidden.has(n) ? hidden.delete(n) : hidden.add(n); if (hidden.size === series.length) hidden.clear(); legend(); draw(); };
        b.onmouseenter = () => { state.focus = b.dataset.n; draw(); };
        b.onmouseleave = () => { state.focus = null; draw(); };
      });
    }
    legend(); draw();
    return draw;
  }

  /* ── 数据整理 ── */
  const G = D.tech_groups;
  G.forEach((g, i) => g.color = PALETTE[i % PALETTE.length]);
  const allStocks = G.flatMap(g => g.stocks.map(s => ({ ...s, group: g.name })));
  const best = [...allStocks].sort((a, b) => b.chg - a.chg);
  const sec = D.sectors, sTop = sec[0], sBot = sec[sec.length - 1];
  const gTop = G[0], gBot = G[G.length - 1];
  const idx = Object.fromEntries(D.indices.map(r => [r.sym, r]));
  const xlk = sec.find(s => s.sym === "XLK");
  const tilesData = [...D.indices, xlk && { ...xlk, name: "科技板块" }].filter(Boolean);

  /* ── 日期回放导航：dates 新→旧 ── */
  function dateNav() {
    if (dates.length < 2 && !replay) return "";
    const i = dates.indexOf(D.date);
    const older = dates[i + 1], newer = i > 0 ? dates[i - 1] : null;
    const href = d => d === latest.date ? "./" : `?date=${d}`;
    const wk = d => "日一二三四五六"[new Date(d + "T12:00:00").getDay()];
    return `<div class="dnav">
      ${older ? `<a class="dbtn" href="${href(older)}" title="${older}">‹ 前一天</a>` : `<span class="dbtn off">‹ 前一天</span>`}
      <select class="dsel" onchange="location.href=this.value">${dates.map(d =>
        `<option value="${href(d)}"${d === D.date ? " selected" : ""}>${d} 周${wk(d)}${d === latest.date ? " · 最新" : ""}</option>`).join("")}</select>
      ${newer ? `<a class="dbtn" href="${href(newer)}" title="${newer}">后一天 ›</a>` : `<span class="dbtn off">后一天 ›</span>`}
      ${replay ? `<a class="dbtn now" href="./">回到最新</a>` : ""}
    </div>`;
  }

  /* ── 渲染 ── */
  app.innerHTML = `
    <div class="head">
      <div>
        <div class="eyebrow">${replay
          ? `<span class="dot" style="background:#a78bfa"></span>历史回放 · ${esc(D.asof_et)}`
          : `<span class="dot${D.closed ? "" : " live"}"></span>${D.closed ? "收盘数据" : "盘中快照"} · ${esc(D.asof_et)} · 每个交易日收盘后自动更新`}</div>
        <h1>${replay ? `${esc(md(D.date))} 板块涨跌` : "今日板块涨跌"}</h1>
        <p class="summary" data-lang="zh">
          标普 <b class="${cls(idx.SPY?.chg)}">${pct(idx.SPY?.chg ?? 0)}</b>，纳指 <b class="${cls(idx.QQQ?.chg)}">${pct(idx.QQQ?.chg ?? 0)}</b>。
          11 大板块中 <b>${sec.filter(s => s.chg > 0).length}</b> 涨 <b>${sec.filter(s => s.chg <= 0).length}</b> 跌，
          领涨 <b>${esc(sTop.name)}</b> <b class="${cls(sTop.chg)}">${pct(sTop.chg)}</b>，领跌 <b>${esc(sBot.name)}</b> <b class="${cls(sBot.chg)}">${pct(sBot.chg)}</b>。
          科技细分最强 <b>${esc(gTop.name)}</b> <b class="${cls(gTop.avg)}">${pct(gTop.avg)}</b>，最弱 <b>${esc(gBot.name)}</b> <b class="${cls(gBot.avg)}">${pct(gBot.avg)}</b>。
        </p>
        <p class="summary" data-lang="en">
          S&amp;P 500 <b class="${cls(idx.SPY?.chg)}">${pct(idx.SPY?.chg ?? 0)}</b>, Nasdaq 100 <b class="${cls(idx.QQQ?.chg)}">${pct(idx.QQQ?.chg ?? 0)}</b>.
          Of the 11 sectors, <b>${sec.filter(s => s.chg > 0).length}</b> rose and <b>${sec.filter(s => s.chg <= 0).length}</b> fell;
          <b>${esc(en(sTop.name))}</b> led <b class="${cls(sTop.chg)}">${pct(sTop.chg)}</b> and <b>${esc(en(sBot.name))}</b> lagged <b class="${cls(sBot.chg)}">${pct(sBot.chg)}</b>.
          Strongest tech group: <b>${esc(gTop.en || en(gTop.name))}</b> <b class="${cls(gTop.avg)}">${pct(gTop.avg)}</b>; weakest: <b>${esc(gBot.en || en(gBot.name))}</b> <b class="${cls(gBot.avg)}">${pct(gBot.avg)}</b>.
        </p>
      </div>
      ${dateNav()}
    </div>

    <div class="tiles">${tilesData.map(t => `
      <div class="tile" style="--tint:${t.chg >= 0 ? "rgba(34,197,94,.25)" : "rgba(244,63,94,.25)"}">
        <div class="t-top"><span class="t-name">${esc(t.name)}</span><span class="t-sym">${t.sym}</span></div>
        <div class="t-chg ${cls(t.chg)}">${pct(t.chg)}</div>
        <div class="t-px">${t.price.toLocaleString()}</div>
        ${spark(t.intraday, 200, 48)}
      </div>`).join("")}
    </div>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">11 大板块<small>SPDR Sector ETFs</small></div>
        <div class="seg" data-chart="sec"><button data-m="intraday" class="on">${replay ? "当日分时" : "今日分时"}</button>${replay ? "" : '<button data-m="month">近一月</button>'}</div></div>
      <div class="two">
        <div class="card"><div class="bars">${(() => { const mx = Math.max(...sec.map(s => Math.abs(s.chg)), 0.5); return sec.map(s => `
          <div class="bar-row"><div class="bl">${esc(s.name)}<span>${s.sym}</span></div>${bar(s.chg, mx)}<div class="bv ${cls(s.chg)}">${pct(s.chg)}</div></div>`).join(""); })()}
        </div></div>
        <div class="card"><div class="chart" id="secChart"></div><div class="legend" id="secLegend"></div></div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">科技细分热力图<small>Tech Sub-sectors · 等权平均</small></div>
        <div style="font-size:.75rem;color:var(--dim)">点击方块跳到成分股</div></div>
      <div class="heat">${G.map(g => `
        <button class="ht" data-k="${g.key}" style="background:${heatBg(g.avg)}">
          <div class="hn">${esc(g.name)}</div><div class="he">${esc(g.en)}</div>
          <div class="hv">${pct(g.avg)}</div><div class="hc">${g.up} 涨 · ${g.down} 跌</div>
          ${spark(g.intraday, 100, 30)}
        </button>`).join("")}
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">细分走势对比<small>悬停图例高亮 · 点击开关</small></div>
        <div class="seg" data-chart="grp"><button data-m="intraday" class="on">${replay ? "当日分时" : "今日分时"}</button>${replay ? "" : '<button data-m="month">近一月</button>'}</div></div>
      <div class="card"><div class="chart" id="grpChart" style="height:400px"></div><div class="legend" id="grpLegend"></div></div>
    </section>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">科技股涨跌榜<small>${allStocks.length} 只龙头</small></div></div>
      <div class="movers">
        ${[["领涨", best.slice(0, 6)], ["领跌", best.slice(-6).reverse()]].map(([h, list]) => `
          <div class="card"><div class="mv-h">${h}</div>${list.map((s, i) => `
            <div class="mv"><span class="rk">${i + 1}</span><span class="nm"><b>${s.sym}</b><span>${esc(s.name)}</span><em>${esc(s.group)}</em></span>${spark(s.intraday, 90, 26)}<span class="v ${cls(s.chg)}">${pct(s.chg)}</span></div>`).join("")}
          </div>`).join("")}
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">成分股明细</div></div>
      <div class="groups">${(() => { const mx = Math.max(...allStocks.map(s => Math.abs(s.chg)), 1); return G.map(g => `
        <div class="grp" id="g-${g.key}">
          <div class="grp-h"><div><div class="gn"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${g.color};margin-right:8px"></span>${esc(g.name)}</div><div class="ge">${esc(g.en)}</div></div>
            <div><div class="gv ${cls(g.avg)}">${pct(g.avg)}</div><div class="gc">${g.up} 涨 · ${g.down} 跌</div></div></div>
          <div class="breadth"><i style="width:${g.up / (g.up + g.down) * 100}%;background:${UP}"></i><i style="flex:1;background:${DOWN}"></i></div>
          ${g.stocks.map(s => `<div class="st"><span class="sn"><b>${s.sym}</b><span>${esc(s.name)}</span></span>${spark(s.intraday, 76, 22)}${bar(s.chg, mx)}<span class="sv ${cls(s.chg)}">${pct(s.chg)}</span></div>`).join("")}
        </div>`).join(""); })()}
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><div class="sec-title">科技细分 ETF<small>Tech ETFs</small></div></div>
      <div class="etfs">${D.tech_etfs.map(e => `<div class="etf"><div class="es">${e.sym}</div><div class="en">${esc(e.name)}</div><div class="ev ${cls(e.chg)}">${pct(e.chg)}</div></div>`).join("")}</div>
    </section>

    <div class="foot"><span data-lang="zh">
      数据来源 Yahoo Finance，${esc(D.asof_et)}。涨跌幅 = 最新价 / 前一交易日收盘价 − 1。科技细分为成分股等权平均，与市值加权的 ETF 可能不同。
      ${D.missing.length ? `本次缺失：${D.missing.map(esc).join(", ")}。` : ""}仅供参考，不构成投资建议。
    </span><span data-lang="en">
      Data: Yahoo Finance, ${esc(D.asof_et)}. Change = last price / previous close − 1. Tech groups are equal-weighted averages of their constituents and may differ from cap-weighted ETFs.
      ${D.missing.length ? `Missing this run: ${D.missing.map(esc).join(", ")}. ` : ""}For reference only, not investment advice.
    </span></div>`;

  /* ── 图表 ── */
  const secSeries = m => sec.map((s, i) => ({ name: s.name, color: s.sym === "XLK" ? "#ffffff" : PALETTE[i % PALETTE.length], bold: s.sym === "XLK", points: s[m] || [] }));
  const grpSeries = m => G.map(g => ({ name: g.name, color: g.color, points: g[m] || [] }));
  const charts = {};
  function mount(key, elId, lgId, fn, m) { charts[key] = lineChart(document.getElementById(elId), document.getElementById(lgId), fn(m), m); }
  mount("sec", "secChart", "secLegend", secSeries, "intraday");
  mount("grp", "grpChart", "grpLegend", grpSeries, "intraday");
  document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    const k = seg.dataset.chart;
    k === "sec" ? mount("sec", "secChart", "secLegend", secSeries, b.dataset.m) : mount("grp", "grpChart", "grpLegend", grpSeries, b.dataset.m);
  }));
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => Object.values(charts).forEach(f => f()), 120); });

  document.querySelectorAll(".ht").forEach(t => t.onclick = () => {
    const el = document.getElementById("g-" + t.dataset.k);
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
  });
})();
</script>
</body>
</html>
